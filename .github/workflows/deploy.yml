name: Deploy TOMATO STRIKE to GitHub Pages

# Builds the static export and publishes it to GitHub Pages.
# The repo is served at https://<user>.github.io/TS-GO/, so the Next.js build
# is given basePath/assetPrefix = /TS-GO via NEXT_PUBLIC_BASE_PATH.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Allow one concurrent deployment; newer pushes cancel in-flight runs.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build static export
        env:
          # Project site lives under /TS-GO/ — must match the repo name exactly.
          NEXT_PUBLIC_BASE_PATH: /TS-GO
        run: npm run build

      - name: Disable Jekyll (keep _next/ assets)
        run: touch out/.nojekyll

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
